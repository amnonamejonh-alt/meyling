
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Meyling ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #222;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* MAIN CARD */

.container {
    position: relative;
    width: min(550px, 95vw);
    height: min(370px, 90vh);
    border-radius: 13px;
    overflow: hidden;

    background: linear-gradient(
        135deg,
        #ffe6df,
        #ffc9b9,
        #ffddd0
    );

    box-shadow: 0 5px 25px rgba(0,0,0,.2);
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* MESSAGE */

.message {
    position: absolute;
    top: 35px;
    left: 28px;
    width: 270px;
    padding: 12px;

    background: rgba(255,255,255,.3);
    border-radius: 8px;

    color: #65605e;
    font-size: 12px;
    line-height: 1.7;

    animation: slideIn 1.5s ease;
}

.name {
    font-size: 18px;
    font-weight: bold;
    color: #e87983;
    margin-bottom: 8px;
}

#typing {
    white-space: pre-wrap;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 13px;
    background: #555;
    vertical-align: middle;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* CLOSE BUTTON */

.close {
    position: absolute;
    right: 10px;
    top: 10px;
    z-index: 20;

    width: 20px;
    height: 20px;

    border: none;
    border-radius: 50%;

    background: #f46e5d;
    color: white;

    font-size: 13px;
    cursor: pointer;
}

/* STICKER AREA */

.sticker-area {
    position: absolute;
    width: 270px;
    height: 270px;

    right: 35px;
    bottom: 15px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* ROTATING CIRCLE */

.orbit {
    position: absolute;
    inset: 0;

    border: 1px dashed rgba(255,255,255,.5);
    border-radius: 50%;

    animation: spin 14s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* ANIMAL STICKERS */

.sticker {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 65px;
    height: 65px;

    margin: -32.5px;

    transform:
        rotate(var(--angle))
        translateY(-108px);
}

.sticker-face {
    width: 65px;
    height: 65px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;

    background: #fffdfb;
    border: 4px solid white;
    border-radius: 50%;

    box-shadow:
        0 5px 12px rgba(100,60,50,.2);

    animation:
        counterSpin 14s linear infinite,
        float 2s ease-in-out infinite alternate;
}

/* KEEP STICKERS UPRIGHT */

@keyframes counterSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(-360deg);
    }
}

/* FLOATING EFFECT */

@keyframes float {
    from {
        translate: 0 0;
    }

    to {
        translate: 0 -7px;
    }
}

/* STICKER POSITIONS */

.sticker:nth-child(1) {
    --angle: 0deg;
}

.sticker:nth-child(2) {
    --angle: 72deg;
}

.sticker:nth-child(3) {
    --angle: 144deg;
}

.sticker:nth-child(4) {
    --angle: 216deg;
}

.sticker:nth-child(5) {
    --angle: 288deg;
}

/* MEYLING PHOTO IN CENTER */

.photo-container {
    position: absolute;
    z-index: 5;

    width: 92px;
    height: 92px;

    border-radius: 50%;
    border: 5px solid white;

    overflow: hidden;

    background: white;

    box-shadow:
        0 4px 15px rgba(100,60,50,.25);

    animation: photoFloat 3s ease-in-out infinite;
}

.photo-container img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

@keyframes photoFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* HEART DECORATIONS */

.heart {
    position: absolute;
    color: #f28c8c;
    font-size: 13px;

    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.4);
    }
}

/* RESPONSIVE */

@media (max-width: 450px) {

    .message {
        left: 15px;
        top: 25px;
        width: 250px;
    }

    .sticker-area {
        width: 220px;
        height: 220px;

        right: 50%;
        bottom: 5px;

        transform: translateX(50%);
    }

    .sticker {
        transform:
            rotate(var(--angle))
            translateY(-88px);
    }

    .sticker-face {
        width: 55px;
        height: 55px;
        font-size: 35px;
    }

    .photo-container {
        width: 80px;
        height: 80px;
    }
}

/* REDUCE MOTION ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}

</style>
</head>

<body>

<div class="container" id="loveCard">

    <!-- CLOSE BUTTON -->

    <button class="close" onclick="closeCard()">×</button>

    <!-- LOVE MESSAGE -->

    <div class="message">

        <div class="name">
            For Meyling ❤️
        </div>

        <div id="typing"></div>

        <span class="cursor"></span>

    </div>

    <!-- CIRCULAR STICKERS -->

    <div class="sticker-area">

        <div class="orbit">

            <div class="sticker">
                <div class="sticker-face">
                    🐱
                </div>
            </div>

            <div class="sticker">
                <div class="sticker-face">
                    🧸
                </div>
            </div>

            <div class="sticker">
                <div class="sticker-face">
                    🐻
                </div>
            </div>

            <div class="sticker">
                <div class="sticker-face">
                    🐰
                </div>
            </div>

            <div class="sticker">
                <div class="sticker-face">
                    🐱
                </div>
            </div>

        </div>

        <!-- MEYLING'S PHOTO -->

        <div class="photo-container">

            <img
                src="img/MeyLing.jpg"
                alt="Meyling ❤️"
            >

        </div>

    </div>

</div>

<script>

/* TYPING ANIMATION */

const message = `Hi, Meyling...
 ❤️`;

let index = 0;

function typeMessage() {

    if (index < message.length) {

        document.getElementById("typing").textContent +=
            message.charAt(index);

        index++;

        setTimeout(typeMessage, 55);
    }

}

window.addEventListener("load", () => {

    setTimeout(typeMessage, 1000);

});

/* CLOSE ANIMATION */

function closeCard() {

    const card = document.getElementById("loveCard");

    card.style.transition = "all .6s ease";

    card.style.opacity = "0";

    card.style.transform = "scale(.7)";

    setTimeout(() => {

        card.style.display = "none";

    }, 600);

}

</script>

</body>
</html>
